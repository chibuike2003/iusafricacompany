<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urofox Admin - Sign Up</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Custom CSS for consistency with admin dashboard theme */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* Light background */
            color: #1a202c; /* Dark text for contrast */
        }
        .header-gradient-bg {
            background: linear-gradient(to right, #008080, #005f5f); /* Teal to darker teal gradient */
        }
        .form-card-shadow {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }
        .input-focus:focus {
            border-color: #008080; /* Teal focus border */
            box-shadow: 0 0 0 3px rgba(0, 128, 128, 0.2); /* Light teal glow */
        }
    </style>
</head>
<body class="antialiased flex flex-col min-h-screen">

    <!-- Header Section -->
    <header class="header-gradient-bg text-white py-4 shadow-md">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <img src="../static/logo.jpg" alt="Urofox Logo" class="w-10 h-10 rounded-full mr-3">
                <h1 class="text-2xl font-bold">Urofox Admin</h1>
            </div>
            <nav>
                <a href="admin_login.html" class="text-white hover:text-gray-200 transition-colors duration-300 px-3 py-2 rounded-md border border-white hover:bg-white hover:text-teal-600">Login</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center py-12 px-4">
        <div class="bg-white p-8 md:p-10 rounded-xl form-card-shadow border border-gray-100 w-full max-w-md">
            <h2 class="text-3xl font-bold text-center mb-8 text-teal-700">Admin Account Sign Up</h2>
            <!-- Flash messages for success/error -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="mb-4">
                        {% for category, message in messages %}
                            <div class="p-3 rounded-lg text-sm {% if category == 'error' %}bg-red-100 text-red-700{% else %}bg-green-100 text-green-700{% endif %}">
                                {{ message }}
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}
            <form action="/admin/signup" method="POST">
                <div class="mb-5">
                    <label for="full-name" class="block text-gray-700 text-sm font-semibold mb-2">Full Name</label>
                    <input type="text" id="full-name" name="full-name" placeholder="Admin Name"
                           class="shadow-sm appearance-none border rounded-lg w-full py-3 px-4 text-gray-700 leading-tight input-focus" required>
                </div>
                <div class="mb-5">
                    <label for="email" class="block text-gray-700 text-sm font-semibold mb-2">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="admin@urofox.com"
                           class="shadow-sm appearance-none border rounded-lg w-full py-3 px-4 text-gray-700 leading-tight input-focus" required>
                </div>
                <div class="mb-5">
                    <label for="phone-number" class="block text-gray-700 text-sm font-semibold mb-2">Phone Number</label>
                    <input type="tel" id="phone-number" name="phone-number" placeholder="+234 801 234 5678"
                           class="shadow-sm appearance-none border rounded-lg w-full py-3 px-4 text-gray-700 leading-tight input-focus">
                </div>
                <div class="mb-5">
                    <label for="job-title" class="block text-gray-700 text-sm font-semibold mb-2">Job Title / Role</label>
                    <input type="text" id="job-title" name="job-title" placeholder="e.g., Senior Administrator"
                           class="shadow-sm appearance-none border rounded-lg w-full py-3 px-4 text-gray-700 leading-tight input-focus" required>
                </div>
                <div class="mb-5">
                    <label for="department" class="block text-gray-700 text-sm font-semibold mb-2">Department</label>
                    <input type="text" id="department" name="department" placeholder="e.g., Operations"
                           class="shadow-sm appearance-none border rounded-lg w-full py-3 px-4 text-gray-700 leading-tight input-focus">
                </div>
                <div class="mb-5">
                    <label for="employee-id" class="block text-gray-700 text-sm font-semibold mb-2">Employee ID (Optional)</label>
                    <input type="text" id="employee-id" name="employee-id" placeholder="e.g., UF-001"
                           class="shadow-sm appearance-none border rounded-lg w-full py-3 px-4 text-gray-700 leading-tight input-focus">
                </div>
                <div class="mb-5">
                    <label for="password" class="block text-gray-700 text-sm font-semibold mb-2">Password</label>
                    <input type="password" id="password" name="password" placeholder="********"
                           class="shadow-sm appearance-none border rounded-lg w-full py-3 px-4 text-gray-700 leading-tight input-focus" required>
                </div>
                <div class="mb-6">
                    <label for="confirm-password" class="block text-gray-700 text-sm font-semibold mb-2">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="********"
                           class="shadow-sm appearance-none border rounded-lg w-full py-3 px-4 text-gray-700 leading-tight input-focus" required>
                </div>
                <button type="submit"
                        class="w-full bg-teal-600 text-white font-bold py-3 px-4 rounded-full hover:bg-teal-700 transition-colors duration-300 focus:outline-none focus:shadow-outline">
                    Register Admin Account <i class="fas fa-user-plus ml-2"></i>
                </button>
            </form>
            <p class="text-center text-gray-600 text-sm mt-6">
                Already have an admin account? <a href="admin_login.html" class="text-teal-600 hover:underline font-semibold">Login here</a>
            </p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="header-gradient-bg text-white py-6 mt-auto shadow-inner">
        <div class="container mx-auto px-4 text-center">
            <p class="mb-4 text-lg">&copy; 2025 Urofox. All rights reserved.</p>
            <div class="flex justify-center space-x-6 mb-2">
                <a href="#" target="_blank" rel="noopener noreferrer" class="text-white hover:text-gray-200 transition-colors duration-300">
                    <i class="fab fa-facebook-f text-2xl"></i>
                </a>
                <a href="#" target="_blank" rel="noopener noreferrer" class="text-white hover:text-gray-200 transition-colors duration-300">
                    <i class="fab fa-linkedin-in text-2xl"></i>
                </a>
                <a href="mailto:support@urofox.com" class="text-white hover:text-gray-200 transition-colors duration-300">
                    <i class="fas fa-envelope text-2xl"></i>
                </a>
            </div>
        </div>
    </footer>

</body>
</html>
